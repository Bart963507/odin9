name: Deploy

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - name: Require API_URL variable
        if: ${{ !startsWith(vars.API_URL, 'https://') }}
        run: |
          echo "::error::Set the repository variable API_URL to the full Railway API URL, starting with https:// (for example https://odin9-production.up.railway.app)"
          exit 1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install packages
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - name: SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
